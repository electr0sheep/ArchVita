appId: dev.archvita.app
productName: ArchVita
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/launcher
    to: launcher
    filter:
      - eboot.bin
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Utility
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
